<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevix Studio | Digital Agency</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Canvas for Water Effect */
        #water-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Content Wrapper above Canvas */
        .content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }

        .site-logo {
            height: 40px;
            width: auto;
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            display: inline-block;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        /* Hero Section */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.25rem;
            color: #9ca3af;
            max-width: 650px;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.85rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s;
            display: inline-block;
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            nav {
                padding: 1.5rem 2rem;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Water Effect Canvas Layer -->
    <canvas id="water-canvas"></canvas>

    <!-- Foreground Content Layer -->
    <div class="content-layer">
        <nav>
            <a href="index.html">
                <!-- If your image path differs (e.g., logo.png), update src below -->
                <img src="assets/logo.png" alt="Aevix Studio Logo" class="site-logo">
            </a>
            <ul class="nav-links">
                <li><a href="#services">Services</a></li>
                <li><a href="#work">Work</a></li>
                <li><a href="#terms">Terms & Policies</a></li>
            </ul>
            <a href="portal.html" class="btn-primary">Start Project</a>
        </nav>

        <section class="hero">
            <h1>Crafting Digital Experiences That Scale</h1>
            <p>Aevix Studio delivers high-performance web development, creative direction, social media management, and digital media assets for global brands.</p>
            <a href="portal.html" class="btn-secondary">Get Started</a>
        </section>
    </div>

    <!-- Script for Background Water Animation -->
    <script src="js/water-effect.js"></script>
</body>
</html>
