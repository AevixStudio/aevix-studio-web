<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevix Studio | Digital Agency</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b111e;
            color: #ffffff;
            min-height: 200vh; /* Enables smooth scrolling effect */
            overflow-x: hidden;
            position: relative;
        }

        /* Navigation Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: rgba(11, 17, 30, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4rem;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 0.18em;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .btn-start {
            background-color: #2563eb;
            color: #ffffff;
            padding: 0.75rem 1.6rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-start:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 8rem 2rem 4rem 2rem;
            overflow: hidden;
        }

        /* Background Image Logo positioned lower for visibility */
        .bg-watermark-logo {
            position: absolute;
            top: 58%; /* Positioned lower so the bottom word is clearly visible */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 620px;
            max-width: 85vw;
            height: auto;
            opacity: 0.18;
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.1s ease-out, transform 0.1s ease-out;
            will-change: transform, opacity;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: -0.01em;
            margin-bottom: 1.75rem;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #9ca3af;
            max-width: 680px;
            line-height: 1.6;
            margin-bottom: 3rem;
            font-weight: 400;
        }

        /* Glossy Dark "Get Started" Button */
        .btn-get-started {
            position: relative;
            z-index: 2;
            display: inline-block;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            padding: 0.95rem 2.5rem;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
        }

        .btn-get-started:hover {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.08) 100%);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            nav { padding: 1.25rem 1.5rem; }
            .hero-content h1 { font-size: 2.5rem; }
            .hero-content p { font-size: 1rem; }
            .nav-links { display: none; }
            .bg-watermark-logo { width: 360px; top: 60%; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="brand-logo">AEVIX STUDIO</a>
            <ul class="nav-links">
                <li><a href="#services">Services</a></li>
                <li><a href="#work">Work</a></li>
                <li><a href="#terms">Terms & Policies</a></li>
            </ul>
            <a href="portal.html" class="btn-start">Start Project</a>
        </nav>
    </header>

    <section class="hero-section">
        <!-- Root logo image file with scroll-fade behavior -->
        <img src="logo.png" alt="Aevix Studio Watermark" class="bg-watermark-logo" id="watermarkLogo">

        <div class="hero-content">
            <h1>Crafting Digital Experiences That Scale</h1>
            <p>Aevix Studio delivers high-performance web development, creative direction, social media management, and digital media assets for global brands.</p>
            <a href="portal.html" class="btn-get-started">Get Started</a>
        </div>
    </section>

    <!-- Scroll Effect Script -->
    <script>
        const watermarkLogo = document.getElementById('watermarkLogo');

        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const maxScroll = 450;
            
            // Calculate opacity (starts at 0.18, fades to 0 as you scroll down)
            const newOpacity = Math.max(0, 0.18 - (scrollY / maxScroll) * 0.18);
            
            // Move logo upward on scroll
            const translateY = -50 - (scrollY * 0.2);

            watermarkLogo.style.opacity = newOpacity;
            watermarkLogo.style.transform = `translate(-50%, ${translateY}%)`;
        });
    </script>
</body>
</html>
