<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const loadingState = document.getElementById('loading-state');
        const loginState = document.getElementById('login-state');
        const googleBtn = document.getElementById('google-btn');

        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';

        // Ensure Supabase CDN object exists
        const supabaseLib = window.supabase || window.Supabase;
        if (!supabaseLib) {
            console.error("Supabase CDN failed to load.");
            loadingState.style.display = 'none';
            loginState.style.display = 'block';
            return;
        }

        const supabaseClient = supabaseLib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                flowType: 'pkce',
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true
            }
        });

        function showLoginUI() {
            loadingState.style.display = 'none';
            loginState.style.display = 'block';
        }

        // Safety fallback timer (forces login UI after 3s if hanging)
        const fallbackTimer = setTimeout(() => {
            showLoginUI();
        }, 3000);

        googleBtn.addEventListener('click', async () => {
            const redirectUrl = window.location.origin + '/portal.html';
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: redirectUrl }
            });
        });

        async function processRouting(session) {
            if (!session) {
                showLoginUI();
                return;
            }

            const userEmail = session.user.email ? session.user.email.toLowerCase() : '';

            // 1. Direct Hardcoded Admin Check
            if (userEmail === 'aevixstudio961@gmail.com') {
                window.location.href = 'admin-portal.html';
                return;
            }

            // 2. Database Profile Check
            try {
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (profile && (profile.role === 'admin' || profile.role === 'team')) {
                    window.location.href = 'admin-portal.html';
                } else {
                    window.location.href = 'client-portal.html';
                }
            } catch (err) {
                window.location.href = 'client-portal.html';
            }
        }

        try {
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                const { data, error } = await supabaseClient.auth.exchangeCodeForSession(authCode);
                clearTimeout(fallbackTimer);
                if (!error && data.session) {
                    await processRouting(data.session);
                    return;
                }
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            clearTimeout(fallbackTimer);
            await processRouting(session);
        } catch (err) {
            console.error("Auth error:", err);
            clearTimeout(fallbackTimer);
            showLoginUI();
        }

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                clearTimeout(fallbackTimer);
                await processRouting(session);
            } else if (event === 'SIGNED_OUT') {
                clearTimeout(fallbackTimer);
                showLoginUI();
            }
        });
    });
</script>
