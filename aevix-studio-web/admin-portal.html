<script>
    const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
            flowType: 'pkce',
            autoRefreshToken: true,
            persistSession: true,
            detectSessionInUrl: true
        }
    });

    const workspaceContent = document.getElementById('workspace-content');
    const logoutBtn = document.getElementById('logout-btn');

    logoutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = 'index.html';
    });

    async function checkUserPermissions(session) {
        if (!session) {
            renderAccessDenied("Authentication required to access this workspace.");
            logoutBtn.style.display = 'none';
            return;
        }

        // Primary admin email bypass check
        if (session.user && session.user.email === 'aevixstudio961@gmail.com') {
            logoutBtn.style.display = 'inline-block';
            fetchAllProjects();
            return;
        }

        // Database role check for non-primary accounts
        try {
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .maybeSingle();

            if (error || !profile || !['admin', 'team'].includes(profile.role)) {
                renderAccessDenied(`Access Denied: Account (${session.user.email}) does not have administrative permissions.`);
                logoutBtn.style.display = 'inline-block';
            } else {
                logoutBtn.style.display = 'inline-block';
                fetchAllProjects();
            }
        } catch (err) {
            console.error("Auth Verification Error:", err);
            renderAccessDenied("An error occurred while checking permissions.");
            logoutBtn.style.display = 'inline-block';
        }
    }

    function renderAccessDenied(message) {
        workspaceContent.innerHTML = `
            <div style="text-align: center; padding: 4rem 2rem; background: #111827; border: 1px solid #1f2937; border-radius: 12px;">
                <h3 style="color: #ef4444; margin-top: 0;">Restricted Access</h3>
                <p style="color: #9ca3af; margin-bottom: 1.5rem;">${message}</p>
                <a href="index.html" style="color: #60a5fa; text-decoration: underline;">Return to Main Site</a>
            </div>
        `;
    }

    async function fetchAllProjects() {
        workspaceContent.innerHTML = `
            <div class="admin-table-container">
                <div style="padding: 2rem; text-align: center; color: #9ca3af;">
                    Loading project management dashboard...
                </div>
            </div>
        `;
    }

    // Initialize: check active session immediately upon load
    (async () => {
        try {
            const { data: { session } } = await supabase.auth.getSession();
            await checkUserPermissions(session);
        } catch (err) {
            console.error("Failed to retrieve session:", err);
            renderAccessDenied("Authentication error. Please sign in again.");
        }
    })();

    // Listen for state changes (sign in, sign out, token refresh)
    supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') {
            renderAccessDenied("Authentication required to access this workspace.");
            logoutBtn.style.display = 'none';
        }
    });
</script>
