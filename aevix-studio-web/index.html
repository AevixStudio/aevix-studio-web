<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevix Studio | Digital Agency</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Clean Header Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            max-width: 1280px;
            margin: 0 auto;
            width: 100%;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.15em;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .btn-start {
            background-color: #2563eb;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-start:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }

        /* Hero Layout */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
        }

        .hero p {
            font-size: 1.25rem;
            color: #9ca3af;
            max-width: 650px;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        /* Interactive Water Effect Button Wrapper */
        .water-btn-wrapper {
            position: relative;
            display: inline-block;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
            transition: border-color 0.2s, background 0.2s;
        }

        .water-btn-wrapper:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        .water-canvas-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .btn-get-started {
            position: relative;
            z-index: 2;
            display: block;
            color: #ffffff;
            padding: 0.9rem 2.2rem;
            font-weight: 600;
            text-decoration: none;
            font-size: 1rem;
            background: transparent;
        }

        @media (max-width: 768px) {
            nav { padding: 1.5rem 2rem; }
            .hero h1 { font-size: 2.5rem; }
            .hero p { font-size: 1rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand-logo">AEVIX STUDIO</a>
        <ul class="nav-links">
            <li><a href="#services">Services</a></li>
            <li><a href="#work">Work</a></li>
            <li><a href="#terms">Terms & Policies</a></li>
        </ul>
        <a href="portal.html" class="btn-start">Start Project</a>
    </nav>

    <section class="hero">
        <h1>Crafting Digital Experiences That Scale</h1>
        <p>Aevix Studio delivers high-performance web development, creative direction, social media management, and digital media assets for global brands.</p>
        
        <div class="water-btn-wrapper" id="waterBtnContainer">
            <canvas id="buttonWaterCanvas" class="water-canvas-btn"></canvas>
            <a href="portal.html" class="btn-get-started">Get Started</a>
        </div>
    </section>

    <!-- Interactive Water Effect Script for Get Started Button -->
    <script>
        const container = document.getElementById('waterBtnContainer');
        const canvas = document.getElementById('buttonWaterCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let ripples = [];

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            ripples.push({ x, y, radius: 2, alpha: 0.5 });
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < ripples.length; i++) {
                let r = ripples[i];
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(59, 130, 246, ${r.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                r.radius += 1.5;
                r.alpha -= 0.015;

                if (r.alpha <= 0) {
                    ripples.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
