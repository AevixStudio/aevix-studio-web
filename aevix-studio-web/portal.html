<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | Aevix Studio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .btn-google {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background 0.2s ease;
        }
        .btn-google:hover {
            background-color: #1d4ed8;
        }
        .status-msg {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="auth-card" id="auth-card">
        <h2 style="margin-top: 0; letter-spacing: 1px;">AEVIX STUDIO</h2>
        
        <div id="loading-state">
            <h3 style="color: #60a5fa; margin-bottom: 0.5rem;">Authenticating...</h3>
            <p class="status-msg">Verifying session credentials and securing routing...</p>
        </div>

        <div id="login-state" style="display: none;">
            <p style="color: #d1d5db; margin-bottom: 0.5rem;">Sign in to access your dashboard</p>
            <button class="btn-google" id="google-btn">Sign In with Google</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                flowType: 'pkce',
                autoRefreshToken: true,
                persistSession: true,
                detectSessionInUrl: true
            }
        });

        const loadingState = document.getElementById('loading-state');
        const loginState = document.getElementById('login-state');
        const googleBtn = document.getElementById('google-btn');

        googleBtn.addEventListener('click', async () => {
            const redirectUrl = window.location.origin + '/portal.html';
            await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: redirectUrl
                }
            });
        });

        async function processRouting(session) {
            if (!session) {
                loadingState.style.display = 'none';
                loginState.style.display = 'block';
                return;
            }

            const userEmail = session.user.email ? session.user.email.toLowerCase() : '';

            // 1. Direct Hardcoded Admin Check
            if (userEmail === 'aevixstudio961@gmail.com') {
                window.location.href = 'admin-portal.html';
                return;
            }

            // 2. Database Profile Check
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .maybeSingle();

            if (profile && (profile.role === 'admin' || profile.role === 'team')) {
                window.location.href = 'admin-portal.html';
            } else {
                window.location.href = 'client-portal.html';
            }
        }

        async function initAuth() {
            // Check for PKCE ?code= parameter manually in case hash parsing missed it
            const urlParams = new URLSearchParams(window.location.search);
            const authCode = urlParams.get('code');

            if (authCode) {
                try {
                    const { data, error } = await supabase.auth.exchangeCodeForSession(authCode);
                    if (!error && data.session) {
                        await processRouting(data.session);
                        return;
                    }
                } catch (e) {
                    console.error("Code exchange exception:", e);
                }
            }

            // Standard session check
            const { data: { session } } = await supabase.auth.getSession();
            await processRouting(session);
        }

        // Auth state listener for sign-in returns
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                await processRouting(session);
            } else if (event === 'SIGNED_OUT') {
                loadingState.style.display = 'none';
                loginState.style.display = 'block';
            }
        });

        // Run on page load
        initAuth();
    </script>
</body>
</html>
