<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Admin Portal | Aevix Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .portal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #1f2937;
        }
        .admin-table-container {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }
        .admin-table th {
            background: #1f2937;
            color: #9ca3af;
            padding: 16px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }
        .admin-table td {
            padding: 14px 16px;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
            vertical-align: middle;
        }
        .admin-table tr:last-child td {
            border-bottom: none;
        }
        .input-inline {
            background: #0b0f17;
            border: 1px solid #374151;
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }
        .input-inline:focus {
            border-color: #3b82f6;
        }
        .action-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #1d4ed8;
        }
        .logout-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>
<body>

    <section class="section-container" style="max-width: 1300px; margin: 0 auto; padding: 2rem 1rem;">
        <div class="portal-header">
            <div>
                <h2>Team Operations Workspace</h2>
                <p class="section-lead" style="margin: 0;">Manage ongoing projects, set deadlines, track payments, and publish client updates.</p>
            </div>
            <button id="logout-btn" class="logout-btn" style="display: none;">Sign Out</button>
        </div>

        <div id="workspace-content">
            <p style="color: #9ca3af;">Verifying administrative permissions...</p>
        </div>
    </section>

    <script>
        // Pre-configured Supabase Connection
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_T4yK_0Sj-cBm38Xq7gK_7w_lpDlolKN';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const workspaceContent = document.getElementById('workspace-content');
        const logoutBtn = document.getElementById('logout-btn');

        logoutBtn.addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        supabase.auth.onAuthStateChange(async (event, session) => {
            if (!session) {
                renderAccessDenied("Authentication required to access this workspace.");
                logoutBtn.style.display = 'none';
                return;
            }

            // Verify user role in profiles table
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();

            if (error || !profile || !['admin', 'team'].includes(profile.role)) {
                renderAccessDenied(`Access Denied: Account (${session.user.email}) does not have administrative permissions.`);
                logoutBtn.style.display = 'inline-block';
            } else {
                logoutBtn.style.display = 'inline-block';
                fetchAllProjects();
            }
        });

        function renderAccessDenied(message) {
            workspaceContent.innerHTML = `
                <div style="text-align: center; padding: 4rem 2rem; background: #111827; border: 1px solid #1f2
