<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | Aevix Studio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0b0f17; color: #fff; font-family: system-ui, sans-serif; margin: 0; }
        .auth-card { background: #131c2e; border: 1px solid #1e293b; padding: 2.5rem; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; }
        .status-msg { margin-top: 1rem; color: #9ca3af; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 style="margin-top:0; letter-spacing: 2px;">AEVIX STUDIO</h2>
        <div id="status-title" style="font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem;">Authenticating...</div>
        <div id="status-desc" class="status-msg">Verifying session credentials and securing routing...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleAuthRouting() {
            const titleEl = document.getElementById('status-title');
            const descEl = document.getElementById('status-desc');

            // 1. Get Session
            const { data: { session }, error } = await supabase.auth.getSession();

            if (error || !session) {
                // Check if session event resolves hash
                supabase.auth.onAuthStateChange(async (event, currentSession) => {
                    if (currentSession) {
                        await routeUser(currentSession.user);
                    } else {
                        window.location.href = 'index.html';
                    }
                });
                return;
            }

            await routeUser(session.user);
        }

        async function routeUser(user) {
            const titleEl = document.getElementById('status-title');
            const descEl = document.getElementById('status-desc');

            titleEl.innerText = "Checking Permissions...";
            
            // 2. Fetch User Profile & Role from database
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            // Direct fallback routing based on your admin email if table isn't updated yet
            if (user.email === 'aevixstudio961@gmail.com' || (profile && profile.role === 'admin')) {
                titleEl.innerText = "Access Granted";
                descEl.innerText = "Redirecting to Team Workspace...";
                window.location.href = 'admin-portal.html';
            } else {
                titleEl.innerText = "Access Granted";
                descEl.innerText = "Redirecting to Client Dashboard...";
                window.location.href = 'client-portal.html';
            }
        }

        document.addEventListener('DOMContentLoaded', handleAuthRouting);
    </script>
</body>
</html>
