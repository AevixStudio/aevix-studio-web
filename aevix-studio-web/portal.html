<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access | Aevix Studio</title>
    <style>
        body {
            background-color: #0b0f17;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .btn-google {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background 0.2s ease;
        }
        .btn-google:hover {
            background-color: #1d4ed8;
        }
        .status-msg {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="auth-card">
        <h2 style="margin-top: 0; letter-spacing: 1px;">AEVIX STUDIO</h2>
        
        <div id="loading-state" style="display: none;">
            <h3 style="color: #60a5fa; margin-bottom: 0.5rem;">Authenticating...</h3>
            <p class="status-msg">Verifying session credentials and securing routing...</p>
        </div>

        <div id="login-state">
            <p style="color: #d1d5db; margin-bottom: 0.5rem;">Sign in to access your dashboard</p>
            <button class="btn-google" id="google-btn">Sign In with Google</button>
            <p class="error-msg" id="error-box"></p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bfabowxtvgknggpqnrpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmYWJvd3h0dmdrbmdncHFucnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTQwMDQsImV4cCI6MjEwMzU5MDAwNH0.zRuc9gF7qtihFHJJrUDXIwD1l0QJBBVHP_KasxJGMKM';

        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const loadingState = document.getElementById('loading-state');
        const loginState = document.getElementById('login-state');
        const googleBtn = document.getElementById('google-btn');
        const errorBox = document.getElementById('error-box');

        function showError(msg) {
            loadingState.style.display = 'none';
            loginState.style.display = 'block';
            errorBox.style.display = 'block';
            errorBox.textContent = msg;
        }

        googleBtn.addEventListener('click', async () => {
            if (!supabase) {
                showError('Supabase client failed to load.');
                return;
            }

            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + window.location.pathname
                    }
                });

                if (error) {
                    showError('Google Auth Error: ' + error.message);
                }
            } catch (err) {
                showError('Unexpected connection error.');
            }
        });

        async function handleRouting(session) {
            if (!session) return;

            loadingState.style.display = 'block';
            loginState.style.display = 'none';

            const email = session.user?.email?.toLowerCase() || '';

            // 1. Direct Hardcoded Super-Admin Email Override
            if (email === 'aevixstudio961@gmail.com') {
                window.location.href = '/admin-portal.html';
                return;
            }

            // 2. Database Role Lookup
            try {
                const { data: profile } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .maybeSingle();

                if (profile && (profile.role === 'admin' || profile.role === 'team')) {
                    window.location.href = '/admin-portal.html';
                } else {
                    window.location.href = '/client-portal.html';
                }
            } catch (err) {
                window.location.href = '/client-portal.html';
            }
        }

        async function init() {
            if (!supabase) return;

            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                await handleRouting(session);
            }

            supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    await handleRouting(session);
                }
            });
        }

        init();
    </script>
</body>
</html>
